name: Metrics
on:
  # Check daily; metrics are updated every 10 days by the schedule gate below
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  schedule_check:
    runs-on: ubuntu-latest
    outputs:
      should_update: ${{ steps.check.outputs.should_update }}
    steps:
      - id: check
        shell: bash
        run: |
          anchor=$(date -u -d '2026-11-11' +%s)
          today=$(date -u +%s)
          days_since=$(( (today - anchor) / 86400 ))

          if (( days_since >= 0 && days_since % 10 == 0 )); then
            echo "should_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_update=false" >> "$GITHUB_OUTPUT"
          fi
  github-metrics:
    needs: schedule_check
    if: ${{ needs.schedule_check.outputs.should_update == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - name: default
        uses: lowlighter/metrics@latest
        with:
          filename: assets/default_metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
      - name: Half-year calendar
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.plugin.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
      - name: Most_used
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.plugin.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 4
      - name: Icons
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.plugin.topics.icons.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_topics: yes
          plugin_topics_limit: 12
          plugin_topics_mode: starred
     
